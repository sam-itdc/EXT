<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>


<link rel="stylesheet" href="assets/css/main.css">

</head>

<body>

<!-- HEADER -->
<div id="header"></div>


<!-- MAIN CONTENT -->

<div class="container">



<div class="row">

<section class="hero-layout">

  <!-- 左側斜切圖片 -->
  <div class="hero-image">
    <img src="images/background8.jpeg" alt="背景圖">
  </div>

<!-- 右側 ICON card -->
<div class="hero-content">
  <h2 class="hero-title">支部簡介</h2>

  <div id="scout-sections" class="flex flex-wrap justify-center my-[16px]">

    <!-- 幼童軍 -->
    <a href="/page-scoutinfo/cub.html" class="group my-[20px] mx-[25px] text-center">
      <div class="bg-white size-[126px] border-[3px] border-white rounded-full flex items-center justify-center
      group-hover:border-[#108b9d] transition">
        <iconify-icon icon="tabler:leaf"
        class="text-[56px] text-gray-600 group-hover:text-[#108b9d]"></iconify-icon>
      </div>
      <p class="text-[#555] max-w-[126px] group-hover:text-[#108b9d] text-[18px] mt-[10px]">
        幼童軍
      </p>
    </a>

    <!-- 童軍 -->
    <a href="/page-scoutinfo/scout.html" class="group my-[20px] mx-[25px] text-center">
      <div class="bg-white size-[126px] border-[3px] border-white rounded-full flex items-center justify-center
      group-hover:border-[#108b9d]">
        <iconify-icon icon="tabler:compass"
        class="text-[56px] text-gray-600 group-hover:text-[#108b9d]"></iconify-icon>
      </div>
      <p class="text-[#555] max-w-[126px] group-hover:text-[#108b9d] text-[18px] mt-[10px]">
        童軍
      </p>
    </a>

    <!-- 深資童軍 -->
    <a href="/page-scoutinfo/venture.html" class="group my-[20px] mx-[25px] text-center">
      <div class="bg-white size-[126px] border-[3px] border-white rounded-full flex items-center justify-center
      group-hover:border-[#108b9d]">
        <iconify-icon icon="tabler:mountain"
        class="text-[56px] text-gray-600 group-hover:text-[#108b9d]"></iconify-icon>
      </div>
      <p class="text-[#555] max-w-[126px] group-hover:text-[#108b9d] text-[18px] mt-[10px]">
        深資童軍
      </p>
    </a>

    <!-- 成年領袖 -->
    <a href="/page-scoutinfo/wood-badge.html" class="group my-[20px] mx-[25px] text-center">
      <div class="bg-white size-[126px] border-[3px] border-white rounded-full flex items-center justify-center
      group-hover:border-[#108b9d]">
        <iconify-icon icon="tabler:user-star"
        class="text-[56px] text-gray-600 group-hover:text-[#108b9d]"></iconify-icon>
      </div>
      <p class="text-[#555] max-w-[126px] group-hover:text-[#108b9d] text-[18px] mt-[10px]">
        成年領袖
      </p>
    </a>

  </div>
</div>

</section>



</div>

</div>




<!-- FOOTER -->
<div id="footer"></div>



<!-- INCLUDE SCRIPT -->

<script>

function loadHTML(id,url){

fetch(url)
.then(res => res.text())
.then(data => {

document.getElementById(id).innerHTML=data;

});

}

loadHTML("header","includes/header.html");
loadHTML("footer","includes/footer.html");

function toggleMenu(){
document.getElementById("menu").classList.toggle("show");
}

</script>




</body>

</html>
