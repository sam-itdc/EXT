<!DOCTYPE html>
<html>
<head>
<title>童軍月刊 - 澳門童軍總會</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<!-- DataTables CSS -->
		<link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
		<link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
		<style>
			/* Custom styles for newsletters page */
			.search-nav {
				background: #f8f9fa;
				padding: 1rem;
				border-radius: 8px;
				margin-bottom: 2rem;
				border: 1px solid #e9ecef;
				display: flex;
				justify-content: space-between;
				align-items: center;
				flex-wrap: wrap;
			}
			
			.search-nav h3 {
				margin: 0;
				color: #3a9257;
				font-size: 1.2rem;
			}
			
			.search-container {
				margin-left: 2rem;
                max-width: 100%;
			}
			
			.search-container input {
				width: 300px;
				padding: 0.75rem;
				border: 2px solid #ddd;
				border-radius: 6px;
				font-size: 1rem;
				box-sizing: border-box;
				transition: border-color 0.3s ease;
			}
			
			.search-container input:focus {
				outline: none;
				border-color: #3a9257;
				box-shadow: 0 0 0 3px rgba(58,146,87, 0.1);
			}
			
			.dataTables_wrapper {
				margin-top: 1rem;
			}
			
			.dataTables_filter {
				display: none; /* 隱藏DataTables默認搜索欄 */
			}
			
			#newslettersTable {
				width: 100% !important;
			}
			
			#newslettersTable th {
				background: #3a9257;
				color: white;
				padding: 12px;
				text-align: left;
			}
			
			#newslettersTable td {
				padding: 10px;
				border-bottom: 1px solid #eee;
			}
			
			/* 調整列寬 */
			#newslettersTable th:nth-child(1),
			#newslettersTable td:nth-child(1) {
				width: 100%; /* 標題列佔100%寬度 */
			}
			
			.newsletter-link {
				color: #3a9257;
				text-decoration: none;
				font-weight: 500;
			}
			
			.newsletter-link:hover {
				text-decoration: underline;
			}
			
			.loading-message {
				text-align: center;
				padding: 2rem;
				color: #666;
				font-style: italic;
			}
			
			.error-message {
				text-align: center;
				padding: 2rem;
				color: #d32f2f;
				background: #ffebee;
				border-radius: 8px;
				margin: 1rem 0;
			}
			
			@media (max-width: 768px) {
				.search-nav {
					flex-direction: column;
					align-items: flex-start;
				}
				
				.search-container {
					margin-left: 0;
					margin-top: 1rem;
					width: 100%;
				}
				
				.search-container input {
					width: 100%;
				}
			}
		</style>
</head>
<body class="is-preload homepage">

<!-- HEADER -->
<div id="header"></div>

<!-- MAIN CONTENT -->
<div id="main-wrapper">
				<div class="container">
					
					<!-- Search Navigation -->
					<div class="search-nav">
						<h3>📖 歷期月刊</h3>
						<div class="search-container">
							<input type="text" id="custom-search" aria-label="搜尋月刊標題" placeholder="搜尋月刊標題...">
						</div>
					</div>
					
					<!-- Newsletters Table -->
					<div class="row gtr-200">
						<div class="col-12">
							<div id="content">
								<div id="loading-message" class="loading-message">
									正在載入童軍月刊資料...
								</div>
								<div id="error-message" class="error-message" style="display: none;">
									載入月刊資料時發生錯誤，請稍後再試。
								</div>
								<table id="newslettersTable" class="display" style="width:100%; display: none;">
									<thead>
										<tr>
											<th>標題</th>
										</tr>
									</thead>
									<tbody>
										<!-- Data will be populated dynamically from newsletters.md -->
									</tbody>
								</table>
							</div>
						</div>
					</div>
					
				</div>
			</div>

<!-- FOOTER -->
<div id="footer"></div>

<script src="assets/js/jquery.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>

<script type="text/javascript" src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>

<script>
// Function to parse newsletters.md content
function parseNewslettersMarkdown(markdownText) {
    const lines = markdownText.split('\n');
    const newsletters = [];
    let currentNewsletter = null;

    for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        if (line.startsWith('- ') && !line.includes('http') && !line.includes('關鍵字')) {
            if (currentNewsletter) newsletters.push(currentNewsletter);
            currentNewsletter = { title: line.substring(2).trim(), link: '', keywords: '' };
        } else if (line.includes('http') && currentNewsletter) {
            const urlMatch = line.match(/https?:\/\/[^\s]+/);
            if (urlMatch) currentNewsletter.link = urlMatch[0];
        } else if (line.includes('關鍵字') && currentNewsletter) {
            currentNewsletter.keywords = line.substring(line.indexOf('-') + 1).trim();
        }
    }

    if (currentNewsletter) newsletters.push(currentNewsletter);
    return newsletters;
}

// Function to display newsletters in DataTable
function displayNewsletters(newsletterData) {
    $('#loading-message').hide();
    $('#newslettersTable').show();

    const table = $('#newslettersTable').DataTable({
        data: newsletterData,
        columns: [
            {
                data: 'title',
                render: function(data, type, row) {
                    if (row.link) {
                        return `<a href="${row.link}" target="_blank" rel="noopener noreferrer" class="newsletter-link">${data}</a>`;
                    } else {
                        return `<span class="newsletter-link">${data}</span><span style="display:block;color:#777;font-size:13px;">Drive 連結待補</span>`;
                    }
                }
            }
        ],
        order: [],
        pageLength: 25,
        language: {
            "sProcessing": "處理中...",
            "sLengthMenu": "顯示 _MENU_ 項結果",
            "sZeroRecords": "沒有匹配結果",
            "sInfo": "顯示第 _START_ 至 _END_ 項結果，共 _TOTAL_ 項",
            "sInfoEmpty": "顯示第 0 至 0 項結果，共 0 項",
            "sInfoFiltered": "(由 _MAX_ 項結果過濾)",
            "sEmptyTable": "表中數據為空",
            "sLoadingRecords": "載入中...",
            "oPaginate": {
                "sFirst": "首頁",
                "sPrevious": "上頁",
                "sNext": "下頁",
                "sLast": "末頁"
            }
        },
        responsive: true,
        dom: 'rtip'
    });

    const searchInput = document.getElementById('custom-search');
    searchInput.addEventListener('input', function () {
        table.search(this.value).draw();
    });
    table.search(searchInput.value).draw();
}

// Read locally maintained Drive links; visitors do not need the legacy website.
async function loadNewsletters() {
    try {
        const response = await fetch('newsletters.md');
        if (!response.ok) throw new Error('Unable to load newsletter list');
        displayNewsletters(parseNewslettersMarkdown(await response.text()));
    } catch (error) {
        console.error('Error loading newsletters:', error);
        $('#loading-message').hide();
        $('#error-message').show().text('載入月刊時發生錯誤，請重新整理頁面。');
    }
}

// Initialize on document ready
$(document).ready(function() {
    loadNewsletters();
});

		</script>

<script src="assets/js/site-shell.js"></script>
<script>initSiteShell("");</script>
</body>
</html>
