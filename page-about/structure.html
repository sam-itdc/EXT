<!DOCTYPE html>
<html>
<head>
<title>組織架構 - 澳門童軍總會</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="../assets/css/main.css" />
		<style>
			/* 組織架構圖片樣式 */
			.structure-image {
				width: 100%;
				max-width: 1200px;
				height: auto;
				margin: 2em auto;
				display: block;
				border: 1px solid #ddd;
				border-radius: 8px;
				box-shadow: 0 4px 15px rgba(0,0,0,0.1);
				cursor: pointer;
				transition: transform 0.3s ease;
			}
			
			.structure-image:hover {
				transform: scale(1.02);
			}
			
			.structure-container {
				text-align: center;
				margin: 2em 0;
			}
			
			.structure-description {
				margin: 1em 0;
				font-style: italic;
				color: #666;
			}
			
			/* 響應式設計 */
			@media screen and (max-width: 768px) {
				.structure-image {
					max-width: 100%;
					margin: 1em auto;
				}
			}
		</style>
</head>
<body class="is-preload no-sidebar">

<!-- HEADER -->
<div id="header"></div>

<!-- MAIN CONTENT -->
<div id="main-wrapper">
					<div class="container">
						<div id="content">

							<!-- Content -->
								<article>
									<h2>組織架構</h2>
									<br>
									
									<div class="structure-container">
										<p class="structure-description">澳門童軍總會組織架構圖</p>
										<img src="../images/about/structure.jpg" alt="澳門童軍總會組織架構圖" class="structure-image" onclick="openImageModal(this)">
										<p class="structure-description">點擊圖片可放大查看</p>
									</div>
								</article>

						</div>
					</div>
				</div>
			
			<!-- 圖片放大模態框 -->
			<div id="imageModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); cursor: pointer;" onclick="closeImageModal()">
				<div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 95%; max-height: 95%;">
					<img id="modalImage" style="width: 100%; height: auto; border-radius: 8px;">
					<div style="text-align: center; color: white; margin-top: 10px; font-size: 14px;">點擊任意處關閉</div>
				</div>
			</div>

<!-- FOOTER -->
<div id="footer"></div>

<script>
				function openImageModal(img) {
					var modal = document.getElementById('imageModal');
					var modalImg = document.getElementById('modalImage');
					modal.style.display = 'block';
					modalImg.src = img.src;
				}
				
				function closeImageModal() {
					document.getElementById('imageModal').style.display = 'none';
				}
				
				// ESC 鍵關閉模態框
				document.addEventListener('keydown', function(event) {
					if (event.key === 'Escape') {
						closeImageModal();
					}
				});
			</script>

<script src="../assets/js/site-shell.js"></script>
<script>initSiteShell("../");</script>
</body>
</html>
