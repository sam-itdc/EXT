									<section class="section-panel" aria-labelledby="section-0"><h2 id="section-0">目的</h2>
									<p>幼童軍支部之目的旨在促進八至十二歲的兒童身心精神的陶冶與啟發，以貫徹整個童軍運動的連續性訓練。</p>

									</section>
<section class="section-panel" aria-labelledby="section-1"><h2 id="section-1">方法</h2>
									<p>在成年人領導下，以幼童軍誓詞規律及森林規則為本，透過愉快的遊戲活動促成心靈和體格的發展，培養良好習慣以適應童軍支的訓練方法。</p>

									</section>
<section class="section-panel" aria-labelledby="section-2"><h2 id="section-2">年齡規限</h2>
									<p>幼童軍支部的年齡規限是由已屆七歲半至十二歲止。</p>

									</section>
