<script type="text/javascript" src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>

<script type="text/javascript" src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>

<script>
			// Category mapping
			const categoryMapping = {
				'訓練班消息': 'training',
				'活動消息': 'activity',
				'國際活動': 'international',
				'總會通告': 'general',
				'服務通告': 'service'
			};
			
			const categoryMappingReverse = {
				'training': '訓練班消息',
				'activity': '活動消息',
				'international': '國際活動',
				'general': '總會通告',
				'service': '服務通告'
			};
			
			function formatDate(dateStr) {
		if (!dateStr) return '';
		const date = new Date(dateStr);
		if (Number.isNaN(date.getTime())) return '';
		return `${date.getFullYear()}年${String(date.getMonth()+1).padStart(2, '0')}月${String(date.getDate()).padStart(2, '0')}日`;
	}

			// Get category badge class
			function getCategoryBadgeClass(categoryKey) {
				const classMap = {
					'training': 'training',
					'activity': 'activity',
					'international': 'international',
					'general': 'general',
					'service': 'service'
				};
				return classMap[categoryKey] || 'general';
			}
			
// Google Forms paragraph answers remain in one cell; split each HTTP(S) URL.
function parseNoticeLinks(value) {
    const matches = String(value || '').match(/https?:\/\/[^\s<>"|]+/gi) || [];
    return [...new Set(matches)];
}

function escapeNoticeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
}

function renderNoticeTitle(title, type, row) {
    if (type !== 'display') return title;
    const safeTitle = escapeNoticeHtml(title);
    const links = parseNoticeLinks(row.link);
    if (!links.length) return '<span class="news-link">' + safeTitle + '</span>';
    if (links.length === 1) {
        return '<a href="' + escapeNoticeHtml(links[0]) + '" target="_blank" rel="noopener noreferrer" class="news-link">' + safeTitle + '</a>';
    }
    return '<span class="news-link">' + safeTitle + '</span>' + links.map((link, index) =>
        '<br><a href="' + escapeNoticeHtml(link) + '" target="_blank" rel="noopener noreferrer" class="news-link">連結 ' + (index + 1) + '</a>'
    ).join('');
}

async function loadAnnouncements() {

    try {

        const sheetAPI = "https://opensheet.elk.sh/1EYMseSkpbsv563Zl_PbD5SX0Nqe9WqSVaLnujThpj-I/newsList";

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);
        let sheetData;
        try {
            const response = await fetch(sheetAPI, { signal: controller.signal });

            if (!response.ok) throw new Error("Sheet API error");
            sheetData = await response.json();
        } finally {
            clearTimeout(timeout);
        }

        const newsData = sheetData.map(sourceRow => {
            const row = Object.fromEntries(Object.entries(sourceRow).map(([key, value]) => [key.trim(), value]));

            const categoryName = String(row.category || row['分類'] || "").trim();
            const categoryKey = categoryMapping[categoryName] || "general";

            return {
                title: row.title || row['標題'] || "",
                category: categoryName,
                categoryKey: categoryKey,
                link: row.link || row['連結'] || "",
                date: formatDate(row.date || row['日期']),
                keywords: row.keywords || row['關鍵字'] || ""
            };

        });

        initializeDataTable(newsData);

        document.getElementById('loading-message').style.display = 'none';
        document.getElementById('announcementsTable').style.display = 'table';

    } catch (error) {

        console.error("Error loading announcements:", error);

        document.getElementById('loading-message').style.display = 'none';
        document.getElementById('error-message').style.display = 'block';

    }

}

			
			// Function to initialize DataTable
			function initializeDataTable(newsData) {
				// Get URL parameter
				function getUrlParameter(name) {
					name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
					var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
					var results = regex.exec(location.search);
					return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
				}
				
				// Get current category from URL
				const currentCategory = getUrlParameter('category');
				
				// Set active button
				if (currentCategory) {
					$('#btn-' + currentCategory).addClass('active');
				} else {
					$('#btn-all').addClass('active');
				}
				
				// Initialize DataTable
				const table = $('#announcementsTable').DataTable({
					data: newsData,
					columns: [
						{
							data: 'category',
							render: function(data, type, row) {
								return '<span class="category-badge ' + getCategoryBadgeClass(row.categoryKey) + '">' + data + '</span>';
							}
						},
						{
							data: 'title',
							render: renderNoticeTitle
						},
					{
						data: 'date',
						className: 'date-cell',
						render: function(data, type, row) {
							if (type === 'sort' || type === 'type') {
								return data || '';
							}
							return data || '-';
						}
					}
					],
					order: [[2, 'desc']], // Sort by date descending
					pageLength: 25,
					language: {
						"sProcessing": "處理中...",
						"sLengthMenu": "顯示 _MENU_ 項結果",
						"sZeroRecords": "沒有匹配結果",
						"sInfo": "顯示第 _START_ 至 _END_ 項結果，共 _TOTAL_ 項",
						"sInfoEmpty": "顯示第 0 至 0 項結果，共 0 項",
						"sInfoFiltered": "(由 _MAX_ 項結果過濾)",
						"sInfoPostFix": "",
						"sSearch": "",
						"sUrl": "",
						"sEmptyTable": "表中數據為空",
						"sLoadingRecords": "載入中...",
						"sInfoThousands": ",",
						"oPaginate": {
							"sFirst": "首頁",
							"sPrevious": "上頁",
							"sNext": "下頁",
							"sLast": "末頁"
						},
						"oAria": {
							"sSortAscending": ": 以升序排列此列",
							"sSortDescending": ": 以降序排列此列"
						}
					},
					responsive: true,
					dom: 'rtip', // 移除搜索欄，只保留表格、信息和分頁
					initComplete: function() {
						// 連接自定義搜索欄
						$('#custom-search').on('keyup', function() {
							table.search(this.value).draw();
						});
					}
				});
				
				// Apply category filter if specified
				if (currentCategory && categoryMappingReverse[currentCategory]) {
					table.column(0).search(categoryMappingReverse[currentCategory]).draw();
				}
				
				// Add custom search functionality for keywords
				$.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
					if (settings.nTable.id !== 'announcementsTable') {
						return true;
					}
					
					const searchTerm = table.search().toLowerCase();
					if (!searchTerm) {
						return true;
					}
					
					const rowData = newsData[dataIndex];
					const searchableText = (
						rowData.title + ' ' + 
						rowData.category + ' ' + 
						rowData.keywords
					).toLowerCase();
					
					return searchableText.includes(searchTerm);
				});
			}
			
			// Load announcements when document is ready
			document.addEventListener('DOMContentLoaded', function() {
				loadAnnouncements();
			});
		</script>
