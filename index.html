<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>澳門童軍總會</title>
<link rel="stylesheet" href="assets/css/main.css">
<style>
body.homepage{
background:linear-gradient(180deg,#eef6f7 0%,#f9f6ef 28%,#ffffff 100%);
}

body.homepage #site-header{
background:
linear-gradient(135deg,rgba(16,139,157,0.96),rgba(14,96,116,0.98)),
radial-gradient(circle at top right,rgba(255,255,255,0.18),transparent 38%);
box-shadow:0 14px 40px rgba(8,67,79,0.18);
}

body.homepage #site-header .header-title{
max-width:1120px;
padding:14px 24px 12px;
font-size:22px;
font-weight:700;
letter-spacing:1px;
text-transform:none;
color:#ffffff;
}

body.homepage #site-header nav{
max-width:1120px;
margin:0 auto 18px;
background:rgba(255,255,255,0.96);
backdrop-filter:blur(10px);
box-shadow:0 18px 36px rgba(6,44,52,0.16);
}

.home-shell{
max-width:1120px;
margin:0 auto;
padding:36px 20px 56px;
}

.home-hero{
display:grid;
grid-template-columns:minmax(0,1fr) minmax(300px,0.9fr);
gap:24px;
align-items:stretch;
margin-bottom:30px;
}

.hero-copy{
background:linear-gradient(140deg,#ffffff 0%,#f4fbfc 100%);
border:1px solid rgba(16,139,157,0.12);
border-radius:32px;
padding:30px 32px;
box-shadow:0 20px 45px rgba(17,74,87,0.10);
position:relative;
overflow:hidden;
}

.hero-copy:after{
content:"";
position:absolute;
right:-40px;
top:-50px;
width:180px;
height:180px;
background:radial-gradient(circle,rgba(16,139,157,0.14),transparent 68%);
}

.hero-kicker{
display:inline-flex;
align-items:center;
gap:10px;
padding:8px 14px;
border-radius:999px;
background:#e6f5f7;
color:#0e6977;
font-size:13px;
font-weight:700;
letter-spacing:0.08em;
text-transform:uppercase;
}

.hero-copy h1{
margin:18px 0 8px;
font-size:clamp(2rem,4vw,3.4rem);
line-height:1.1;
color:#09343d;
}

.hero-copy p{
margin:0;
font-size:1rem;
line-height:1.8;
color:#34565d;
max-width:44rem;
}

.hero-actions{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:26px;
}

.hero-actions a{
display:inline-flex;
align-items:center;
justify-content:center;
min-width:160px;
padding:12px 18px;
border-radius:999px;
text-decoration:none;
font-weight:700;
transition:transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.hero-actions a:hover{
transform:translateY(-2px);
}

.action-secondary{
background:#fbf3e9;
color:#7f5f35;
}

.hero-side{
display:grid;
gap:18px;
}

.hero-card{
background:#fff;
border-radius:28px;
padding:24px;
border:1px solid rgba(16,139,157,0.10);
box-shadow:0 14px 30px rgba(17,74,87,0.10);
}

.hero-card h2{
margin:0 0 12px;
font-size:1.35rem;
color:#0d5561;
}

.quick-nav{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:14px;
margin-top:18px;
}

.quick-nav-item{
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
gap:10px;
padding:18px 14px;
text-align:center;
text-decoration:none;
border-radius:22px;
background:linear-gradient(180deg,#f5fbfb 0%,#ffffff 100%);
border:1px solid rgba(16,139,157,0.12);
color:#244d54;
transition:transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.quick-nav-item:hover{
transform:translateY(-3px);
border-color:rgba(16,139,157,0.28);
box-shadow:0 14px 24px rgba(17,74,87,0.10);
}

.quick-nav-icon{
width:68px;
height:68px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#f2c67d;
color:#0d5561;
box-shadow:0 12px 24px rgba(16,139,157,0.18);
border:2px solid #0d5561;
}

.quick-nav-icon svg{
width:30px;
height:30px;
stroke:currentColor;
stroke-width:2;
fill:none;
stroke-linecap:round;
stroke-linejoin:round;
}

.quick-nav-item strong{
display:block;
font-size:1rem;
line-height:1.4;
color:#0d5561;
}

.home-dashboard{
display:grid;
grid-template-columns:minmax(0,1.5fr) minmax(280px,0.95fr);
gap:24px;
align-items:start;
}

.panel{
background:#fff;
border-radius:30px;
padding:24px;
border:1px solid rgba(16,139,157,0.10);
box-shadow:0 16px 36px rgba(17,74,87,0.10);
}

.panel-header{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:16px;
margin-bottom:18px;
}

.panel-header h2{
margin:0;
font-size:1.45rem;
color:#09343d;
}

.panel-link{
display:inline-flex;
align-items:center;
justify-content:center;
padding:10px 16px;
border-radius:999px;
text-decoration:none;
font-weight:700;
background:#eef7f8;
color:#0f7382;
white-space:nowrap;
}

.facebook-card{
display:block;
text-decoration:none;
color:inherit;
border-radius:30px;
overflow:hidden;
background:#fff;
border:1px solid rgba(16,139,157,0.10);
box-shadow:0 20px 45px rgba(17,74,87,0.12);
transition:transform 0.22s ease, box-shadow 0.22s ease;
}

.facebook-card:hover{
transform:translateY(-4px);
box-shadow:0 26px 54px rgba(17,74,87,0.16);
}

.facebook-card-cover{
position:relative;
min-height:350px;
background:
linear-gradient(115deg,rgba(9,52,61,0.38),rgba(9,52,61,0.10)),
url("images/background2.jpeg") center/cover no-repeat;
display:flex;
align-items:flex-end;
padding:26px;
}

.facebook-card-cover:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(180deg,transparent 28%,rgba(7,34,40,0.36) 100%);
}

.facebook-card-badge{
position:absolute;
top:22px;
right:22px;
z-index:1;
display:inline-flex;
align-items:center;
gap:8px;
padding:9px 14px;
border-radius:999px;
background:rgba(255,255,255,0.92);
color:#1877f2;
font-weight:700;
font-size:0.95rem;
box-shadow:0 10px 24px rgba(9,52,61,0.12);
}

.facebook-card-body{
position:relative;
z-index:1;
display:flex;
align-items:center;
gap:16px;
color:#fff;
}

.facebook-avatar{
width:68px;
height:68px;
border-radius:50%;
background:#fff;
padding:6px;
box-shadow:0 10px 22px rgba(0,0,0,0.15);
flex:0 0 auto;
}

.facebook-avatar img{
width:100%;
height:100%;
object-fit:contain;
border-radius:50%;
}

.facebook-meta strong{
display:block;
font-size:1.25rem;
line-height:1.3;
}

.facebook-meta span{
display:block;
margin-top:4px;
color:rgba(255,255,255,0.88);
}

.facebook-card-content{
padding:22px 24px 24px;
}

.facebook-card-footer{
display:flex;
align-items:center;
justify-content:space-between;
gap:16px;
padding-top:16px;
border-top:1px solid rgba(16,139,157,0.12);
color:#0f7382;
font-weight:700;
}

.facebook-card-footer span:last-child{
display:inline-flex;
align-items:center;
justify-content:center;
padding:10px 16px;
border-radius:999px;
background:#eef7f8;
}

.notice-list{
list-style:none;
margin:0;
padding:0;
display:grid;
gap:12px;
}

.notice-list li{
margin:0;
padding:0;
}

.notice-list a{
display:block;
padding:14px 16px 14px 20px;
border-radius:18px;
text-decoration:none;
background:#f7fbfb;
color:#23474f;
line-height:1.7;
border:1px solid transparent;
position:relative;
transition:transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.notice-list a:before{
content:"";
position:absolute;
left:10px;
top:22px;
width:6px;
height:6px;
border-radius:50%;
background:#108b9d;
}

.notice-list a:hover{
transform:translateY(-2px);
border-color:rgba(16,139,157,0.22);
box-shadow:0 12px 20px rgba(17,74,87,0.08);
}

.loading-text,
.error-text{
display:block;
padding:14px 16px;
border-radius:18px;
background:#f7fbfb;
color:#5a7177;
}

.error-text{
background:#fff1f0;
color:#b1473a;
}

@media (max-width:980px){
.home-hero,
.home-dashboard{
grid-template-columns:1fr;
}
}

@media (max-width:640px){
.home-shell{
padding:24px 14px 42px;
}

.hero-copy,
.hero-card,
.panel{
border-radius:22px;
padding:20px;
}

.panel-header{
flex-direction:column;
}

.panel-link{
width:100%;
}

.quick-nav{
grid-template-columns:1fr;
}
}
</style>
</head>

<script>
function loadHTML(id, url, callback) {
fetch(url)
.then((res) => res.text())
.then((data) => {
const target = document.getElementById(id);
if (!target) return;
target.innerHTML = data;
if (typeof callback === "function") callback(target);
});
}

loadHTML("header", "includes/header.html", (target) => {
const header = target.querySelector(".header-wrap");
if (header) {
header.id = "site-header";
}
});

loadHTML("footer", "includes/footer.html");

function toggleMenu() {
const menu = document.getElementById("menu");
if (menu) {
menu.classList.toggle("show");
}
}

async function loadLatestNews() {
const latestNewsList = document.getElementById("latest-news-list");
if (!latestNewsList) return;

try {
const apiUrl = "https://scout.wpang.net/INT/api/javascript.php?key=AEM2013_HQNotice";
const response = await fetch(apiUrl);
if (!response.ok) throw new Error("HTTP error " + response.status);

const responseText = await response.text();
let htmlContent = "";
let match = responseText.match(/document\.write\('([\s\S]+?)'\)/);

if (match) {
htmlContent = match[1];
} else {
match = responseText.match(/document\.write\("([\s\S]+?)"\)/);
if (match) {
htmlContent = match[1];
} else {
throw new Error("Could not parse API response format");
}
}

const unescapedHtml = htmlContent
.replace(/\\n/g, "\n")
.replace(/\\t/g, "\t")
.replace(/\\'/g, "'")
.replace(/\\"/g, "\"")
.replace(/\\\\/g, "\\");

const tempDiv = document.createElement("div");
tempDiv.innerHTML = unescapedHtml;

const listItems = tempDiv.querySelectorAll("li");
if (listItems.length === 0) {
latestNewsList.innerHTML = '<li class="error-text">暫時未能讀取最新通告。</li>';
return;
}

const processedNotices = Array.from(listItems).map((item) => {
const link = item.querySelector("a");
if (!link) return null;

const title = (link.textContent || link.innerText || "").trim();
let href = link.getAttribute("href") || "";

if (href) {
href = href.replace(/https?:\/\/www\.scout\.org\.mo/gi, "https://scout.wpang.net");
href = href.replace(/www\.scout\.org\.mo/gi, "https://scout.wpang.net");
if (href.startsWith("http://")) href = "https://" + href.substring(7);
}

if (!title || !href) return null;
return { title, link: href };
}).filter(Boolean);

if (processedNotices.length === 0) {
latestNewsList.innerHTML = '<li class="error-text">暫時未能讀取最新通告。</li>';
return;
}

latestNewsList.innerHTML = processedNotices.map((notice) => {
const escapedTitle = notice.title
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
return '<li><a href="' + notice.link + '" target="_blank" rel="noopener noreferrer">' + escapedTitle + "</a></li>";
}).join("");
} catch (error) {
console.error("Error loading notices from API:", error);
latestNewsList.innerHTML = '<li class="error-text">最新通告暫時無法載入，請稍後再試。</li>';
}
}

document.addEventListener("DOMContentLoaded", function () {
loadLatestNews();
});
</script>
